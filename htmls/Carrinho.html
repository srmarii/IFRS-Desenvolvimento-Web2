<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Tênis Daora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="cabecalho">
        <div>
            <a class="logo" href="Index.html">Tênis Daora</a>
        </div>

        <input type="checkbox" id="menu-toggle" class="menu-toggle"> <!-- checkbox oculto para o menu mobile
        O <input type="checkbox"> guarda o estado (marcado/desmarcado)
        O <label> com o ☰ é o botão visível — clicar nele marca/desmarca o checkbox
        O CSS usa o seletor :checked para mostrar/esconder o menu-->
        <label for="menu-toggle" class="menu-icon">☰</label>

        <nav class="menu-principal">
            <ul>
                <li><a href="Index.html">Início</a></li>
                <li><a href="Carrinho.html">Carrinho</a></li>
            </ul>
        </nav>
    </header>

    <main class="pagina-carrinho">
        <h1>Meu carrinho</h1>

        <section class="itens-carrinho">
            <div class="item-carrinho">
                <img src="../imagens/newbalance1.webp" alt="Tênis New Balance 530">

                <div class="informacoes-carrinho">
                    <h3>Tênis New Balance 530</h3>
                    <p>R$ 749,90 (35)</p>

                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" min="1" value="1">
                </div>

                <button class="btn-remover" type="button">Remover</button>
            </div>

            <div class="item-carrinho">
                <img src="../imagens/vans1.webp" alt="Tênis estiloso">

                <div class="informacoes-carrinho">
                    <h3>Tênis Old School Black White</h3>
                    <p>R$ 399,90 (38)</p>

                    <label for="quantidade">Quantidade:</label>
                    <input type="number" id="quantidade" min="1" value="1">
                </div>

                <button class="btn-remover" type="button">Remover</button>
            </div>
        </section>

        <aside class="resumo-carrinho"> <!-- sessão que fica do lado -->
            <h2>Resumo da compra</h2>
            <p>Subtotal: <strong>R$ 1,149,80</strong></p>
            <p>Frete: <strong>R$ 19,90</strong></p>
            <hr> <!-- horizontal rule -->
            <p class="total-carrinho">Total: <strong>R$ 1,169,70</strong></p>
            <button class="btn-finalizar" type="button">Finalizar compra</button>
        </aside>
    </main>

    <footer class="rodape">
        <p>&copy; 2026. Trabalho de Desenvolvimento Web de Gabriel e Mariana.</p>
    </footer>
</body>
</html>
