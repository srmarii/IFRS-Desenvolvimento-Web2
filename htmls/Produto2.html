<!DOCTYPE html>

<body>

   <header class="cabecalho">
        <div><a class="logo" href="Index.html">Tênis Daora</a></div>
        
        <input type="checkbox" id="menu-toggle" class="menu-toggle"> <!-- checkbox oculto para o menu mobile
        O <input type="checkbox"> guarda o estado (marcado/desmarcado)
        O <label> com o ☰ é o botão visível — clicar nele marca/desmarca o checkbox
        O CSS usa o seletor :checked para mostrar/esconder o menu-->

        <nav class="menu-principal">
            <ul>
                <li><a href="Index.html">Início</a></li>
                <li><a href="Carrinho.html">Carrinho</a></li>
            </ul>
        </nav>
    </header>
    <main class="container-produto">
        <section class="galeria">
            <img src="../imagens/azul1.webp" alt="TENIS DO SONIC" class="img-principal">
            
            <div class="thumbnails">
                <img src="../imagens/azul2.webp" alt="Miniatura 1">
                <img src="../imagens/azul3.webp" alt="Miniatura 2">
                <img src="../imagens/azul4.webp" alt="Miniatura 3">

        <section class="info-detalhe">
            <span class="badge-estatico">Novo</span>
            <h1>ASICS' GEL-BND MEGA MAN</h1>
            <p class="preco-destaque">R$ 549,90</p>
            
            <p class="descricao">O MEGA MAN é o robô poderoso.</p>
            
            <h3>Características:</h3>
            <ul class="lista-recursos">

                <li>Design e Estética Pixelada.</li>
                <li>Referências ao Jogo.</li>
                <li>Estrutura e Embalagem.</li>

            <div class="opcoes-compra">

                <select id="tamanho">
                    <option value="38">38</option>
                    <option value="39">39</option>
                    <option value="40">40</option>
                    <option value="41">41</option>
                    <option value="42">42</option>
                </select>

                <a href="Carrinho.html" class="btn btn-block">Adicionar ao Carrinho</a>
            </div>
        </section>
    </main>

    <footer class="rodape">
